# Perfil de pruebas: base de datos en memoria (H2), no necesita MySQL ni XAMPP
spring.datasource.url=jdbc:h2:mem:prosetup_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=clave-de-pruebas-para-jwt-con-mas-de-32-caracteres-123456
