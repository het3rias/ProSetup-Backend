spring.application.name=prosetup-backend
server.port=8080

# ---------- Base de datos MySQL (XAMPP) ----------
# Por defecto XAMPP usa usuario root sin contraseña. Se puede cambiar con variables de entorno.
spring.datasource.url=jdbc:mysql://localhost:3306/prosetup?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# La clave debe tener al menos 32 caracteres. En un entorno real se define con la variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:prosetup-clave-secreta-de-desarrollo-cambiar-0123456789}
app.jwt.access-minutes=30
app.jwt.refresh-days=7

# ---------- CORS (frontend React con Vite) ----------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
